<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jQuery Click Events</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <script>
        $(document).ready(function(){

            $("#button1").click(function(){
                $("#paragraph1").hide();
            });
            $("#button3").click(function(){
                $("#paragraph1").show();
            });
          
            $("#button2").click(function(){
                $("#paragraph2").hide();
            });
            $("#button4").click(function(){
                $("#paragraph2").show();
            });

        });
    </script>
  </head>
  <body>
    <header>
      <h1>Labs</h1>
      <nav> <!--navigation menu-->
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="labs.html">Labs</a></li>
          <li><a href="lab2.html">Back</a></li>  
        </ul>
      </nav>
    </header>
    
    <p id="paragraph1">
        This is the first paragraph.
    </p>

    <p id="paragraph2">
        This is the second paragraph.
    </p>

    <button id="button1">Hide Paragraph 1</button>
    <button id="button3">Show Paragraph 1</button>
    <button id="button2">Hide Paragraph 2</button>
    <button id="button4">Hide Paragraph 2</button>

</body>
</html>
