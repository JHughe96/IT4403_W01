<head>
    <title>jQuery Click Events</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function(){

            $("#button1").click(function(){
                $("#paragraph1").hide();
            });

            $("#button2").click(function(){
                $("#paragraph2").hide();
            });

        });
    </script>
</head>
