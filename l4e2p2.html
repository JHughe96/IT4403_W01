    <main> <!-- main content section -->
      <h1>Album Information</h1>

    <div id="albumInfo"></div>

    <h2>Photos</h2>

    <div id="photoList"></div>

    <script>

        // Get the album ID from the URL
        let parameters = new URLSearchParams(window.location.search);

        let albumId = parameters.get("albumId");


        // Retrieve information about the selected album
        fetch("https://jsonplaceholder.typicode.com/albums/" + albumId)
            .then(response => response.json())
            .then(data => {

                document.getElementById("albumInfo").innerHTML =
                    "<p><strong>Album Title:</strong> " +
                    data.title +
                    "</p>" +

                    "<p><strong>Album ID:</strong> " +
                    data.id +
                    "</p>" +

                    "<p><strong>User ID:</strong> " +
                    data.userId +
                    "</p>";

            })
            .catch(error => {
                console.log("Error:", error);
            });


        // Retrieve all photos for the selected album
        fetch("https://jsonplaceholder.typicode.com/photos?albumId=" + albumId)
            .then(response => response.json())
            .then(data => {

                let output = "";

                // Loop through the photos
                for (let i = 0; i < data.length; i++) {

                    output +=
                        "<div>" +

                        "<p><strong>" +
                        data[i].title +
                        "</strong></p>" +

                        "<img src='" +
                        data[i].thumbnailUrl +
                        "' alt='" +
                        data[i].title +
                        "'>" +

                        "</div>";
                }

                document.getElementById("photoList").innerHTML = output;

            })
            .catch(error => {
                console.log("Error:", error);
            });

    </script>
